name: Renovate Bot

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no PRs created)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

enable-email-notifications: true

# Only DRY_RUN needed at workflow level; everything else in config.js
env:
  RENOVATE_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'full' || '' }}
  RENOVATE_ENDPOINT: ${{ forgejo.server_url }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL}}

jobs:
  renovate:
    runs-on: forgejo-host
    container:
      image: docker.io/renovate/renovate:43

    steps:
      - name: Checkout config
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          renovate
