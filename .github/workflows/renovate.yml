name: Renovate

# ─────────────────────────────────────────────────────────────────────────────
# Self-hosted Renovate with autodiscovery: runs daily at 22:00 UTC and opens
# dependency-update PRs across ALL repos matching autodiscoverFilter in
# .github/renovate.json (currently shaftoe/*).
#
# Requires a PAT (fine-grained: contents + PR read/write on target repos, or
# classic with `repo` scope) stored as the RENOVATE_TOKEN secret.
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: read

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate.json
